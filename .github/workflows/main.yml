
name: Build DeathDimension V2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Exact Source
        run: |
          set -e
          mkdir source

          unzip -oq DeathDimensionV2.1-PickupEvent-CompileFix-Source.zip -d source

          test -f source/pom.xml || {
            echo "pom.xml tidak ditemukan di source/pom.xml"
            exit 1
          }

      - name: Build Plugin
        run: mvn -B -f source/pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathDimension-V2.1-Fixed
          path: source/target/*.jar
          if-no-files-found: error
